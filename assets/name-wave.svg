<svg width="465" height="66" viewBox="0 0 465 66" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hi, I'm Tejas Abhale">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.25"/>
    </filter>
    <style>
      .letter {
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#nameGrad);
        filter: url(#softShadow);
        animation: floatWave 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        transform-origin: center;
      }
      @keyframes floatWave {
        0%, 55%, 100% { transform: translateY(0); opacity: 1; }
        27% { transform: translateY(-12px); opacity: 0.82; }
      }
      @media (prefers-reduced-motion: reduce) {
        .letter { animation: none; }
      }
    </style>
  </defs>
